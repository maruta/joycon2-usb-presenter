CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
# Joy-Con 2 demands LE Secure Connections; refuse legacy pairing.
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_GATT_CLIENT=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_NAME_CNT=1
CONFIG_BT_SCAN_MANUFACTURER_DATA_CNT=1

# Joy-Con 2 sends 63-byte ATT notifications. Default ATT MTU 23 only carries
# 20 bytes of payload, so request a larger MTU and matching ACL buffers.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# CONFIG_BT_AUTO_DATA_LEN_UPDATE may not exist in older NCS versions; commented
# out for now. Re-enable if available — gives ~10% throughput improvement.
# CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# Joy-Con 2 likely uses 2M PHY post-connect; allow PHY change negotiation.
CONFIG_BT_USER_PHY_UPDATE=y

# Disable RPA on initial bring-up to remove a variable; revisit later.
CONFIG_BT_PRIVACY=n

# Increase BT TX processor thread stack size to prevent stack overflow when receiving directed
# advertising right after boot. On nRF54L15 the maximum measured stack usage is 936 bytes.
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_DK_LIBRARY=y

# Composite USB device via the *device_next* stack (matches the dongle's
# board-default CDC ACM console). Adds HID alongside CDC ACM.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
# Disable the board's automatic CDC ACM init so we can stand up a single
# usbd context that contains both CDC ACM and HID. Class itself must stay
# enabled so usbd_register_all_classes() picks it up.
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
